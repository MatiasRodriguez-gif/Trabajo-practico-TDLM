<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/estilos.css">
    <title>Sumate</title>
</head>
<body>
    <section id="Sumate">
        <h2>Sumate a nuestro equipo</h2>

            <form action="#" method="POST">
            <div>
            <label for="nombre">Nombre y apellido</label>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
            </div>

            <div>
            <label for="email">Correo electronico</label>
            <input type="email" id="email" name="email" placeholder="tu@mail.com" required>
            </div>

            <div>
            <label for="telefono">Numero de telefono</label>
            <input type="tel" id="telefono" name="telefono" placeholder="+5411 0000-000">
            </div>

    <button type="submit">Enviar</button>
</form>
    </section>
     <footer id="Contacto">
        <h2>Contacto</h2>
    
            <a href="mailto:info@bitDeEsperanza.org.ar">info@bitDeEsperanza.com.ar</a><br>
            <a href="https://instagram.com/bitDeEsperanza_org" target="_blank">Seguinos en instagram  </a>
    </footer>
</body>
</html>
